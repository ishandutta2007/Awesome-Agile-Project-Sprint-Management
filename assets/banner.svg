<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-0.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .anim-float1 { animation: floatSlow 7s ease-in-out infinite; }
      .anim-float2 { animation: floatReverse 8s ease-in-out infinite; }
      .anim-pulse1 { animation: pulseGlow 5s ease-in-out infinite; transform-origin: 200px 100px; }
      .anim-pulse2 { animation: pulseGlow 6s ease-in-out infinite 2s; transform-origin: 1000px 320px; }
      .anim-dash { stroke-dasharray: 8 6; animation: dashMove 4s linear infinite; }
      
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Ambient Nebula Spheres (Background Layer) -->
  <g opacity="0.45">
    <circle class="anim-pulse1" cx="200" cy="100" r="160" fill="#38bdf8" filter="url(#glow)" opacity="0.3" />
    <circle class="anim-pulse2" cx="1000" cy="300" r="180" fill="#a855f7" filter="url(#glow)" opacity="0.25" />
    <circle cx="600" cy="210" r="220" fill="#6366f1" filter="url(#glow)" opacity="0.15" />
  </g>

  <!-- Tech Grid Background -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Connecting Agile Workflow Stream (Behind Main Text) -->
  <g class="anim-dash" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.4">
    <path d="M 80 80 Q 300 20, 600 80 T 1120 70" />
    <path d="M 80 360 Q 350 400, 650 350 T 1120 360" />
  </g>

  <!-- Dynamic Floating Decorative Cards (Flanking Sides - Does not obscure center) -->
  <!-- Left Side: Sprint Velocity Card -->
  <g class="anim-float1" transform="translate(60, 130)" filter="url(#cardShadow)">
    <rect width="180" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="18" width="60" height="8" rx="4" fill="#38bdf8" />
    <text x="16" y="45" fill="#94a3b8" class="mono-text" font-size="11">SPRINT 42</text>
    <text x="16" y="70" fill="#f8fafc" class="title-text" font-size="18">Velocity 94%</text>
    <!-- Mini velocity bars -->
    <rect x="16" y="90" width="18" height="42" rx="3" fill="#334155" />
    <rect x="16" y="105" width="18" height="27" rx="3" fill="#38bdf8" />
    <rect x="44" y="90" width="18" height="42" rx="3" fill="#334155" />
    <rect x="44" y="96" width="18" height="36" rx="3" fill="#818cf8" />
    <rect x="72" y="90" width="18" height="42" rx="3" fill="#334155" />
    <rect x="72" y="100" width="18" height="32" rx="3" fill="#c084fc" />
    <rect x="100" y="90" width="18" height="42" rx="3" fill="#334155" />
    <rect x="100" y="92" width="18" height="40" rx="3" fill="#4ade80" />
    <circle cx="145" cy="112" r="14" fill="#1e293b" stroke="#4ade80" stroke-width="2" />
    <text x="145" y="116" text-anchor="middle" fill="#4ade80" class="mono-text" font-size="10">✓</text>
  </g>

  <!-- Right Side: Kanban Flow Card -->
  <g class="anim-float2" transform="translate(960, 130)" filter="url(#cardShadow)">
    <rect width="180" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="18" width="50" height="8" rx="4" fill="#818cf8" />
    <text x="16" y="45" fill="#94a3b8" class="mono-text" font-size="11">KANBAN FLOW</text>
    <text x="16" y="70" fill="#f8fafc" class="title-text" font-size="18">In Progress (3)</text>
    <!-- Task items -->
    <rect x="16" y="86" width="148" height="18" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="95" r="4" fill="#f59e0b" />
    <rect x="40" y="92" width="70" height="6" rx="3" fill="#94a3b8" />
    <rect x="16" y="112" width="148" height="18" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="121" r="4" fill="#38bdf8" />
    <rect x="40" y="118" width="90" height="6" rx="3" fill="#94a3b8" />
  </g>

  <!-- Top Pill / Category Identifier -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#475569" stroke-width="1" />
    <circle cx="-115" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" text-anchor="middle" fill="#cbd5e1" class="mono-text" font-size="11" letter-spacing="1.5">CURATED AGILE STACK 2026</text>
  </g>

  <!-- FOREGROUND: Main Title & Subtitle (Guaranteed Crisp & Clear in Foreground) -->
  <!-- Subtle Backing Glow for Title to Guarantee 100% Readability -->
  <rect x="260" y="118" width="680" height="74" rx="20" fill="rgba(2, 6, 23, 0.65)" filter="url(#glow)" />
  
  <text class="title-text" x="600" y="165" text-anchor="middle" font-size="44" fill="#ffffff">
    Awesome <tspan fill="url(#accentGrad)">Agile &amp; Sprint</tspan> Management
  </text>

  <!-- Subtitle -->
  <text class="sub-text" x="600" y="215" text-anchor="middle" font-size="19" fill="#94a3b8">
    Curated SaaS Platforms &amp; Open-Source Projects for High-Velocity Teams
  </text>

  <!-- Agile Feature Badges / Highlights in Center Foreground -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: Sprint Planning -->
    <g transform="translate(-250, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" class="mono-text" font-size="12">⚡ Sprint Planning</text>
    </g>
    <!-- Pill 2: Scrum Ceremonies -->
    <g transform="translate(-80, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#818cf8" class="mono-text" font-size="12">🔄 Scrum &amp; Kanban</text>
    </g>
    <!-- Pill 3: Velocity & SAFe -->
    <g transform="translate(95, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#c084fc" class="mono-text" font-size="12">📈 Velocity Tracking</text>
    </g>
    <!-- Pill 4: Open Source -->
    <g transform="translate(265, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="rgba(74, 222, 128, 0.12)" stroke="#4ade80" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#4ade80" class="mono-text" font-size="12">🌐 100% Self-Hosted</text>
    </g>
  </g>

  <!-- Bottom Accent Shimmer Line -->
  <rect x="350" y="340" width="500" height="2" rx="1" fill="url(#accentGrad)" opacity="0.6" />
</svg>
